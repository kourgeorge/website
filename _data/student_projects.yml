- year: 2026
  workshop: "Workshop in Learning Systems and Autonomous Agents, MTA (course 150070)"
  title: "LARA: Long-horizon Autonomous Reasoning Agent"
  students: ["Lior Rusanovsky", "Gilad Poliker", "Omer Zilberberg"]
