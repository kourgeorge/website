# Projects and data-sets on Links & Resources (_includes/github_projects.liquid).
# Facts, star counts and links come from the T-21 survey (2026-11-26).
# Fields: group, title, url, blurb (one plain line), stars (optional; left out
# for datasets, PDFs and repos with 0 stars), language (optional),
# links (site, docs, pypi, dataset; optional), order.
# Items are shown sorted by "order"; groups appear in the order of their first
# item, so keep each group's numbers together (10s, 20s, ...).
# Refresh the star numbers by hand: bash scripts/update-github-stars.sh

